[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "video-highlighter"
version = "1.0.0"
description = "AI video highlight generator: extract highlights and build a combined reel from a library of videos."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "moviepy>=2.0.0",
    "opencv-python>=4.11",
    "scenedetect>=0.6.6",
    "tensorflow>=2.19",
    "numpy>=2.1",
    "pillow>=10.4",
    "tqdm>=4.67",
]

[project.optional-dependencies]
faces = ["face-recognition>=1.3.0", "dlib>=19.24"]
downloaders = [
    "python-dotenv>=1.0",
    "requests>=2.32",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.0",
    "telethon>=1.36",
    "humanize>=4.0",
    "pytz>=2024.1",
    "ffmpeg-python>=0.2.0",
]

[project.scripts]
video-highlighter = "video_highlighter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
